plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'me.modmuss50.mod-publish-plugin' version '0.8.4'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.createmod.net' }          // Create, Ponder, Flywheel
    maven { url = 'https://mvn.devos.one/snapshots' }      // Registrate
    maven { url = 'https://maven.blamejared.com' }         // JEI
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            // Own folder so test runs don't rotate the dev client's logs in run/
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runGameTestServer -PexportPonder=true  -> run-gametest/ponder_export/steam_redliner.nbt
            systemProperty 'redline.exportPonder', providers.gradleProperty('exportPonder').getOrElse('false')
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"

    // Allthemodium in the dev client so the ingots/recipes exist while testing.
    // runtimeOnly "curse.maven:allthemodium-364466:${allthemodium_curse_file_id}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version, neo_version_range: neo_version_range,
            create_version_range   : create_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version            : mod_version, mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Release to CurseForge / Modrinth: `./gradlew publishMods`, run by .github/workflows/release.yml on a v* tag.
// Each platform is enabled only when its project id is set, so CurseForge can go live before Modrinth.
// Without any token it's a dry run, which validates the config and uploads nothing.
// GitHub Actions passes unset variables/secrets as empty strings, so treat empty as absent.
def env = { String name -> providers.environmentVariable(name).filter { !it.isBlank() } }
def cfProject = env('CURSEFORGE_PROJECT_ID')
def mrProject = env('MODRINTH_PROJECT_ID')

publishMods {
    file = jar.archiveFile
    displayName = "${mod_name} ${mod_version}"
    version = mod_version
    changelog = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText.orElse('')
    type = STABLE
    modLoaders.add 'neoforge'
    dryRun = env('CURSEFORGE_TOKEN').orElse(env('MODRINTH_TOKEN')).map { false }.orElse(true)

    if (cfProject.isPresent() || !providers.environmentVariable('CI').isPresent()) {
        curseforge {
            projectId = cfProject.orElse('000000')
            accessToken = env('CURSEFORGE_TOKEN')
            minecraftVersions.add minecraft_version
            javaVersions.add JavaVersion.VERSION_21
            clientRequired = true // blocks, renderers and Ponder: needed on both sides
            serverRequired = true
            requires 'create'
            optional 'allthemodium' // recipes are gated on it; the mod loads without it
        }
    }
    if (mrProject.isPresent()) {
        modrinth {
            projectId = mrProject
            accessToken = env('MODRINTH_TOKEN')
            minecraftVersions.add minecraft_version
            requires 'create'
        }
    }
}
