name: Release

# Push a tag matching mod_version in gradle.properties, e.g.  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write # to create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mod_version ${version} in gradle.properties"
            exit 1
          fi

      - name: Build
        run: ./gradlew build
      - name: GameTests
        run: ./gradlew runGameTestServer

      # Project ids are repository *variables*; tokens are *secrets*. A platform without a project id is skipped.
      - name: Publish to CurseForge / Modrinth
        run: ./gradlew publishMods
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: GitHub release
        run: gh release create "${GITHUB_REF_NAME}" build/libs/*.jar --title "Create: Redline ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
